<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Velocidade da Luz</title>
    <script>
        var velocidadeMetrosPorSegundo = 299792458;

        var metrosParaCentimetros = 100;
        var segundoParaNanossegundo = 1 / 1000000000;

        var velocidadeCentimetrosPorNanossegundo =
            velocidadeMetrosPorSegundo *
            metrosParaCentimetros *
            segundoParaNanossegundo;

        alert(
            "Velocidade da luz: " +
            velocidadeCentimetrosPorNanossegundo +
            " cm/ns"
        );
    </script>
</head>
<body>
</body>
</html>
